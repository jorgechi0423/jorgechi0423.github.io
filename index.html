<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOG // 我的博客</title>
  <link rel="stylesheet" href="style.css">
  <!-- highlight.js 代码高亮主题 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- marked.js Markdown 解析 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <!-- 粒子背景 -->
  <canvas id="particlesCanvas"></canvas>

  <!-- 导航栏 -->
  <header class="header">
    <div class="container header-inner">
      <a href="#/" class="logo">◈ BLOG</a>
      <nav class="nav">
        <a href="#/" class="nav-link" data-route="/">~/home</a>
        <a href="#/about" class="nav-link" data-route="/about">~/about</a>
        <button id="themeToggle" class="theme-btn" title="切换主题">🌙</button>
      </nav>
      <button class="menu-btn" id="menuBtn" title="菜单">☰</button>
    </div>
  </header>

  <!-- 移动端菜单 -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#/" class="nav-link" data-route="/">~/home</a>
    <a href="#/about" class="nav-link" data-route="/about">~/about</a>
  </div>

  <!-- 主内容区 -->
  <main class="main container" id="app">
    <!-- 动态渲染 -->
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <p>© 2026 BLOG // Powered by Code & Coffee</p>
      </div>
      <div class="footer-right" id="busuanziContainer">
        <span class="stat-item">👁 <span id="busuanzi_value_site_pv">-</span> views</span>
        <span class="stat-item">👤 <span id="busuanzi_value_site_uv">-</span> visitors</span>
      </div>
    </div>
  </footer>

  <!-- 不蒜子 访问统计 -->
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script src="script.js"></script>
</body>
</html>
