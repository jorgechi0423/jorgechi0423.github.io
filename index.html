<!--
 * 博客首页 — Editorial / Awwwards 级设计
 * 纯静态 SPA：HTML + CSS + JS
 * 路由：hash-based，marked.js 渲染 Markdown
 *
 * 设计语言：编辑级排版 · 充裕留白 · 精緻微交互
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOG · 文字与生活</title>

  <!-- Google Fonts: Inter (UI) + Source Serif 4 (阅读/标题) + JetBrains Mono (代码) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@350;400;450;500;600;650&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- highlight.js（使用柔和主题） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- marked.js Markdown 解析 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>

  <!-- ═══ 导航栏 ═══ -->
  <header class="header" id="siteHeader">
    <div class="header-inner">
      <a href="#/" class="logo">BLOG</a>
      <nav class="nav">
        <a href="#/" class="nav-link" data-route="/">首页</a>
        <a href="#/archive" class="nav-link" data-route="/archive">归档</a>
        <a href="#/tags" class="nav-link" data-route="/tags">标签</a>
        <a href="#/about" class="nav-link" data-route="/about">关于</a>
        <button id="themeToggle" class="theme-btn" title="切换深浅色模式" aria-label="切换主题">🌙</button>
      </nav>
      <button class="menu-btn" id="menuBtn" title="菜单" aria-label="菜单">☰</button>
    </div>
  </header>

  <!-- 移动端菜单 -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#/" class="nav-link" data-route="/">首页</a>
    <a href="#/archive" class="nav-link" data-route="/archive">归档</a>
    <a href="#/tags" class="nav-link" data-route="/tags">标签</a>
    <a href="#/about" class="nav-link" data-route="/about">关于</a>
  </div>

  <!-- 主内容区 -->
  <main class="main container" id="app">
    <!-- 骨架屏占位（首次加载时显示，数据准备好后替换） -->
    <div id="skeletonRoot"></div>
  </main>

  <!-- 文章侧边悬浮目录 TOC（桌面端可见） -->
  <aside class="toc-container" id="tocContainer">
    <div class="toc-title">目录</div>
    <ul class="toc-list" id="tocList"></ul>
  </aside>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <p>© 2026 BLOG · 安静写作</p>
      </div>
      <div class="footer-right" id="busuanziContainer">
        <span class="stat-item">👁 <span id="busuanzi_value_site_pv">-</span> views</span>
        <span class="stat-item">👤 <span id="busuanzi_value_site_uv">-</span> visitors</span>
      </div>
    </div>
  </footer>

  <!-- 不蒜子 访问统计 -->
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <!-- 文章索引（由 build.js 自动生成） -->
  <script src="posts-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
